<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1024px; height: 1024px; background: transparent; display: grid; place-items: center; }
  .tile {
    width: 1024px; height: 1024px; border-radius: 230px;
    background: linear-gradient(160deg, #131922 0%, #0b0e12 60%, #0a0d11 100%);
    border: 6px solid #1c232d;
    display: grid; place-items: center;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  }
  .wm { font-size: 290px; font-weight: 700; letter-spacing: .02em; color: #eef2f7; transform: translateY(-8px); }
  .sel {
    position: relative; display: inline-block; color: #8bc8f2;
    border: 10px dashed #5aa9e6; border-radius: 34px;
    padding: 2px 26px 8px; margin-left: 20px;
    background: rgba(90, 169, 230, .09);
  }
  .sel::before, .sel::after {
    content: ""; position: absolute; width: 46px; height: 46px;
    background: #5aa9e6; border-radius: 12px;
  }
  .sel::before { top: -28px; left: -28px; }
  .sel::after { bottom: -28px; right: -28px; }
</style></head><body>
  <div class="tile"><span class="wm">JA<span class="sel">ST</span></span></div>
</body></html>
